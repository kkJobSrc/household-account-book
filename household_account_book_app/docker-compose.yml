version: '3.8'

services:
  backend:
    build: ./backend
    container_name: kakeibo-backend
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./data/kakeibo.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: kakeibo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  playwright:
    image: mcr.microsoft.com/playwright/python:v1.52.0-noble
    container_name: kakeibo-playwright
    network_mode: host
    volumes:
      - ../:/workspace:ro
    working_dir: /workspace
    profiles:
      - test
    command: sleep infinity

volumes:
  db-data:
