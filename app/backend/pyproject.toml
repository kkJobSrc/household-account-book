[project]
name = "kakeibo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "pydantic==2.7.1",
    "python-multipart==0.0.9",
    "pillow==10.3.0",
    "pillow-heif==0.16.0",
    "alembic==1.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
