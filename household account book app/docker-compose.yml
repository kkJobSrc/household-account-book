version: '3.8'

services:
  backend:
    build: ./backend
    container_name: kakeibo-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - db-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/kakeibo.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: kakeibo-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
