[project]
name = "ocr_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pillow==10.3.0",
    "numpy==1.26.4",
    "paddleocr==2.8.1",
    "paddlepaddle==2.6.2",
    # paddlepaddle imports setuptools at runtime (paddle.utils.cpp_extension),
    # but modern uv-managed venvs don't bundle it by default like classic
    # virtualenv/pip did, so it must be declared explicitly.
    "setuptools>=70.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]
